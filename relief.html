<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neumorphism Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#eef2f2;

    overflow: hidden;
}

/* ==========================
   GRID
========================== */

.grid{

    position:relative;

    width:1200px;
    height:1200px;

}

/* ==========================
   CARD
========================== */

.card{

    position:absolute;

    width:100px;
    height:100px;

    border-radius: 5px;

    background:#eef1f1;

    box-shadow:
        8px 8px 10px #cde1e6,
        inset 20px 10px 100px #d7eaf483,
        -8px -8px 10px #ffffff,
        inset -20px -10px 100px #ffffffdf;

}

/* ==========================
   GRAND BLOC
========================== */

.large{

    width: 400px;
    height: 400px;

    border-radius: 10px;

    box-shadow:
        10px 10px 20px #cde1e6,
        inset 20px 20px 100px #d7eaf483,
        -10px -10px 20px #ffffff,
        inset -20px -20px 100px #ffffffdf;

}

/* ==========================
   POSITIONNEMENT
========================== */

/* haut */

.c1{
    top: 350px;;
    left:0;
}

.c2{
    top: 350px;
    left: 125px;
}

.c3{
    top:350px;
    left: 850px;
}

/* centre */

.large{
    top:350px;
    left:250px;
}

/* bas */

.c4{
    top:600px;
    left:700px;
}

.c5{
    top:600px;
    left:920px;
}

/* ==========================
   INNER GLOW
========================== */



</style>

</head>
<body>

<div class="grid">

    <div class="card c1"></div>
    <div class="card c2"></div>
    <div class="card c3"></div>

    <div class="card large"></div>

    <div class="card c4"></div>
    <div class="card c5"></div>

</div>

</body>
</html>
