<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neumorphism Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content: flex-end;
    align-items:center;

    background:#eef2f2;

    overflow-x:hidden;
    overflow-y:auto;

}


/* ==========================
   GRID
========================== */

.grid{

    display:flex;

    gap:30px;

    align-items:flex-end;

    margin-right: 5%;    

}

/* ==========================
   CARD
========================== */

.card{
    width: 250px;

    padding:5px;

    border-radius:5px;

    background:#eef1f1;

    overflow:hidden;

    box-shadow:none;

    transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.card img{
    width:100%;
    height:100%;
    border-radius:5px;

    display:block;

    object-fit:cover;
    object-position:center;
}



.column{

    display:flex;

    flex-direction:column;

    gap:30px;

}





</style>

</head>

<body>

    <div class="grid">

        <script>

            const grid = document.querySelector('.grid');

            const columns = 4;
            const rows = 10;

            const images = {

                1: 'image/1.jpg',
                12: 'image/11.jpg',
                2: 'image/2.jpg',
                5: 'image/5.jpg',
                10: 'image/10.jpg',
                40: 'image/40.jpg',
                15: 'image/31.jpg',
                39: 'image/39.jpg',
                23: 'image/23.jpg',
                29: 'image/49.jpg',
                26: 'image/51.jpg',
                4: 'image/32.jpg',
                8: 'image/30.jpg',
                10: 'image/8.jpg',
                16: 'image/19.jpg',
                20: 'image/6.jpg',
                24: 'image/12.jpg',
                28: 'image/20.jpg',
                32: 'image/47.jpg',
                36: 'image/52.jpg',


            };

            for(let column = 0; column < columns; column++){

                const columnElement = document.createElement('div');

                columnElement.className = 'column';

                for(let row = 0; row < rows; row++){

                    const card = document.createElement('div');

                    card.className = 'card';

                    const randomHeight =
                        Math.floor(Math.random() * (120 - 70 + 1)) + 70;

                    card.style.height = `${randomHeight}px`;

                    const cardNumber = column * rows + row + 1;

                    if(images[cardNumber]){

                        const image = document.createElement('img');

                        image.src = images[cardNumber];

                        card.appendChild(image);

                    }

                    columnElement.appendChild(card);

                }

                grid.appendChild(columnElement);

            }

            const cards = document.querySelectorAll('.card');

            const radius = 160;


            grid.addEventListener('mousemove', (event) => {

                const mouseX = event.clientX;
                const mouseY = event.clientY;


                cards.forEach(card => {

                    const rect = card.getBoundingClientRect();

                    const cardX = rect.left + rect.width / 2;
                    const cardY = rect.top + rect.height / 2;

                    const dx = mouseX - cardX;
                    const dy = mouseY - cardY;

                    const distance = Math.sqrt(dx * dx + dy * dy);


                    if(distance < radius){

                        const strength = 1 - (distance / radius);

                        const lift = 10 * strength;

                        const shadow = 14 * strength;

                        
                        card.style.transform =
                            `translateY(${-lift}px)`;

                        card.style.boxShadow = `
                            ${shadow}px ${shadow}px ${shadow * 2}px #cde1e6,
                            inset ${10 * strength}px ${10 * strength}px ${50 * strength}px #d7eaf483,
                            ${-shadow}px ${-shadow}px ${shadow * 2}px #ffffff,
                            inset ${-10 * strength}px ${-10 * strength}px ${50 * strength}px #ffffffdf
                        `;

                    } else {

                        card.style.transform = 'translateY(0)';
                        card.style.boxShadow = 'none';

                    }

                });

            });


            grid.addEventListener('mouseleave', () => {

                cards.forEach(card => {

                    card.style.transform = 'translateY(0)';
                    card.style.boxShadow = 'none';

                });

            });

        </script>

    </div>

</body>
</html>
