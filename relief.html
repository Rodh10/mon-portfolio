<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neumorphism Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#eef2f2;

    overflow:hidden;
}


/* ==========================
   GRID
========================== */

.grid{

    display:grid;

    grid-template-columns:repeat(15, 70px);
    grid-template-rows:repeat(7, 70px);

    gap:10px;

}


/* ==========================
   CARD
========================== */

.card{

    width:70px;
    height:70px;

    border-radius:5px;

    background:#eef1f1;

    box-shadow:none;

    transition:
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.7s cubic-bezier(0.22, 1, 0.36, 1);

}


/* ==========================
   HOVER
========================== */

.card{
    width:70px;
    height:70px;

    border-radius:5px;

    background:#eef1f1;

    box-shadow:none;

    transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

</style>

</head>

<body>

    <div class="grid">

        <script>

            const grid = document.querySelector('.grid');

            for(let i = 0; i < 105; i++){

                const card = document.createElement('div');

                card.className = 'card';

                grid.appendChild(card);

            }


            const cards = document.querySelectorAll('.card');

            const radius = 160;


            grid.addEventListener('mousemove', (event) => {

                const mouseX = event.clientX;
                const mouseY = event.clientY;


                cards.forEach(card => {

                    const rect = card.getBoundingClientRect();

                    const cardX = rect.left + rect.width / 2;
                    const cardY = rect.top + rect.height / 2;

                    const dx = mouseX - cardX;
                    const dy = mouseY - cardY;

                    const distance = Math.sqrt(dx * dx + dy * dy);


                    if(distance < radius){

                        const strength = 1 - (distance / radius);

                        const lift = 10 * strength;

                        const shadow = 14 * strength;

                        card.style.transform =
                            `translateY(${-lift}px)`;

                        card.style.boxShadow = `
                            ${shadow}px ${shadow}px ${shadow * 2}px #cde1e6,
                            inset ${10 * strength}px ${10 * strength}px ${50 * strength}px #d7eaf483,
                            ${-shadow}px ${-shadow}px ${shadow * 2}px #ffffff,
                            inset ${-10 * strength}px ${-10 * strength}px ${50 * strength}px #ffffffdf
                        `;

                    } else {

                        card.style.transform = 'translateY(0)';
                        card.style.boxShadow = 'none';

                    }

                });

            });


            grid.addEventListener('mouseleave', () => {

                cards.forEach(card => {

                    card.style.transform = 'translateY(0)';
                    card.style.boxShadow = 'none';

                });

            });

        </script>

    </div>

</body>
</html>
